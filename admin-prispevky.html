<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; connect-src 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title.admin">Admin – ANS 2027</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="app">

  <nav class="sidebar" aria-label="Menu administrácie">
    <a class="sidebar__brand" href="admin.html">ANS 2027</a>
    <p class="sidebar__role" id="role-name"></p>

    <ul class="sidebar__menu">
      <li><a href="admin.html" data-i18n="side.overview">Prehľad</a></li>
      <li><a href="admin-ucastnici.html" data-i18n="side.participants">Účastníci</a></li>
      <li><a href="admin-platby.html" data-i18n="side.payments">Platby</a></li>
      <li><a href="admin-prispevky.html" aria-current="page" data-i18n="side.papers">Príspevky</a></li>
      <li><a href="admin-recenzie.html" data-i18n="side.reviews">Recenzie</a></li>
      <li><a href="admin-program.html" data-i18n="side.program">Program</a></li>
      <li><a href="admin-emaily.html" data-i18n="side.emails">E-maily</a></li>
      <li><a href="admin-nastavenia.html" data-i18n="side.settings">Nastavenia</a></li>
    </ul>

    <ul class="lang sidebar__lang" aria-label="Jazyk / Language">
      <li><button type="button" data-lang="sk">SK</button></li>
      <li><button type="button" data-lang="en">EN</button></li>
    </ul>

    <a class="sidebar__link" href="superadmin.html" data-auth="superadmin" data-i18n="nav.superadmin" hidden>Super admin</a>
    <a class="sidebar__link" href="index.html" data-i18n="side.website">Späť na web</a>
    <button class="link-button sidebar__link" type="button" data-logout data-i18n="btn.logout">Odhlásiť sa</button>
  </nav>

  <main class="app__main" id="admin-main" hidden>
    <header class="app__head">
      <h1 data-i18n="side.papers">Príspevky</h1>
    </header>

    <p class="alert" id="error" hidden></p>

    <section class="card table-card" aria-labelledby="papers-title">
      <header class="table-card__head">
        <h2 id="papers-title" data-i18n="adm.papers.title">Príspevky</h2>
      </header>
      <table class="table">
        <thead>
          <tr>
            <th scope="col" data-i18n="adm.col.title">Názov</th>
            <th scope="col" data-i18n="adm.col.author">Autor</th>
            <th scope="col" data-i18n="adm.col.type">Typ</th>
            <th scope="col" data-i18n="adm.col.status">Stav</th>
            <th scope="col" data-i18n="adm.col.change">Zmeniť stav</th>
          </tr>
        </thead>
        <tbody id="papers-body"></tbody>
      </table>
      <p class="muted table-card__empty" id="papers-empty" data-i18n="adm.none">Zatiaľ tu nič nie je.</p>
    </section>

    <section class="card table-card" aria-labelledby="symposia-title">
      <header class="table-card__head">
        <h2 id="symposia-title" data-i18n="adm.sym.title">Tematické oblasti (symposiá)</h2>
      </header>
      <ul class="plain-list" id="symposia-list"></ul>
      <form class="inline-form" id="symposium-form">
        <label class="field">
          <span data-i18n="adm.sym.sk">Názov po slovensky</span>
          <input type="text" name="nameSk" required>
        </label>
        <label class="field">
          <span data-i18n="adm.sym.en">Názov po anglicky</span>
          <input type="text" name="nameEn" required>
        </label>
        <button class="button" type="submit" data-i18n="adm.sym.add">Pridať oblasť</button>
      </form>
    </section>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin-common.js"></script>
  <script src="js/admin-papers.js"></script>
</body>
</html>
